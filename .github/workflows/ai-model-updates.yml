name: 同步 AI 模型年鉴

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 同步模型年鉴
        id: sync
        run: python3 scripts/sync_llm_timeline.py
      - name: 提交文章和快照
        if: steps.sync.outputs.initialized == 'true' || steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/llm-timeline-snapshot.json content/docs/ai-model-updates
          git commit -m "docs: update AI model timeline"
          git push origin HEAD:main
      - name: 显式触发 Pages 部署
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yaml --repo "${{ github.repository }}" --ref main
